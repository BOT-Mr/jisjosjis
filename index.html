
  </script>

  <!-- PUZZLE GATE: PEMBUKA WEBSITE -->
  <style>
    .puzzle-gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, #fffdf7, transparent 60%),
        #F7F4EC;
      opacity: 1;
      visibility: visible;
      transition: opacity .8s ease, visibility .8s ease;
    }

    .puzzle-gate.unlocked {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .puzzle-content {
      width: min(440px, 100%);
      text-align: center;
      animation: fade-up 1s ease both;
    }

    .puzzle-kicker {
      color: #69765A;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .puzzle-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      color: #393F34;
      font-size: clamp(2.4rem, 8vw, 3.5rem);
      font-weight: 500;
      line-height: 1;
      margin-bottom: 12px;
    }

    .puzzle-description {
      color: #77786B;
      font-size: .9rem;
      margin-bottom: 25px;
    }

    .puzzle-board {
      width: min(340px, 85vw);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 7px;
      margin: 0 auto 20px;
      background: #E1E5D9;
      border: 1px solid #C8B486;
      border-radius: 17px;
      box-shadow: 0 15px 40px rgba(57,63,52,.13);
    }

    .puzzle-piece {
      border: 0;
      padding: 0;
      border-radius: 8px;
      background-image: url("foto-14.png");
      background-size: 300% 300%;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: transform .2s ease, outline .2s ease;
    }

    .puzzle-piece.selected {
      outline: 3px solid #69765A;
      outline-offset: -3px;
      transform: scale(.94);
    }

    .puzzle-piece:focus-visible {
      outline: 3px solid #C8B486;
      outline-offset: -3px;
    }

    .puzzle-message {
      min-height: 25px;
      color: #69765A;
      font-size: .85rem;
      margin-bottom: 15px;
    }

    .puzzle-enter {
      display: none;
      border: 0;
      border-radius: 999px;
      padding: 13px 24px;
      color: white;
      background: #4D5A43;
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(77,90,67,.16);
      animation: soft-pulse 2s ease-in-out infinite;
    }

    .puzzle-enter.show {
      display: inline-block;
    }

    .puzzle-hint {
      color: #99998D;
      font-size: .75rem;
      margin-top: 16px;
    }

    @media (max-width: 480px) {
      .puzzle-board {
        width: min(310px, 85vw);
      }
    }
  </style>

  <div class="puzzle-gate" id="puzzleGate">
    <div class="puzzle-content">

      <div class="puzzle-kicker">
        A little game before you enter
      </div>

      <h1 class="puzzle-title">
        One little puzzle ♡
      </h1>

      <p class="puzzle-description">
        Sebelum masuk, coba susun kembali potongan foto ini.
        Take your time.
      </p>

      <div class="puzzle-board" id="puzzleBoard"></div>

      <div class="puzzle-message" id="puzzleMessage">
        Tap two pieces to switch their places.
      </div>

      <button class="puzzle-enter" id="puzzleEnter" type="button">
        ENTER MY LITTLE WORLD ♡
      </button>

      <p class="puzzle-hint">
        A little something made just for you.
      </p>

    </div>
  </div>

  <script>
    (() => {
      const gate = document.getElementById("puzzleGate");
      const board = document.getElementById("puzzleBoard");
      const message = document.getElementById("puzzleMessage");
      const enterButton = document.getElementById("puzzleEnter");

      let pieces = [0,1,2,3,4,5,6,7,8];
      let selected = null;
      let completed = false;

      function shufflePuzzle() {
        pieces = [0,1,2,3,4,5,6,7,8];

        let previousMove = -1;

        for (let i = 0; i < 100; i++) {
          const first = Math.floor(Math.random() * 9);
          let second;

          do {
            second = Math.floor(Math.random() * 9);
          } while (
            second === first ||
            second === previousMove
          );

          [pieces[first], pieces[second]] =
            [pieces[second], pieces[first]];

          previousMove = first;
        }

        if (pieces.every((piece, index) => piece === index)) {
          [pieces[0], pieces[1]] = [pieces[1], pieces[0]];
        }
      }

      function renderPuzzle() {
        board.innerHTML = "";

        pieces.forEach((piece, position) => {
          const tile = document.createElement("button");
          tile.type = "button";
          tile.className = "puzzle-piece";

          const row = Math.floor(piece / 3);
          const col = piece % 3;

          tile.style.backgroundPosition =
            `${col * 50}% ${row * 50}%`;

          tile.setAttribute(
            "aria-label",
            "Potongan puzzle " + (position + 1)
          );

          if (selected === position) {
            tile.classList.add("selected");
          }

          tile.addEventListener("click", () => {
            selectPiece(position);
          });

          board.appendChild(tile);
        });
      }

      function selectPiece(position) {
        if (completed) return;

        if (selected === null) {
          selected = position;
          renderPuzzle();
          message.textContent =
            "Sekarang pilih potongan kedua ♡";
          return;
        }

        if (selected === position) {
          selected = null;
          renderPuzzle();
          message.textContent =
            "Pilih dua potongan untuk ditukar.";
          return;
        }

        [pieces[selected], pieces[position]] =
          [pieces[position], pieces[selected]];

        selected = null;
        renderPuzzle();
        checkPuzzle();
      }

      function checkPuzzle() {
        const solved = pieces.every(
          (piece, index) => piece === index
        );

        if (solved) {
          completed = true;
          message.textContent =
            "You found every piece! ♡";

          enterButton.classList.add("show");
        } else {
          message.textContent =
            "Almost there. Keep going! ♡";
        }
      }

      enterButton.addEventListener("click", () => {
        gate.classList.add("unlocked");
        document.body.style.overflow = "";
      });

      document.body.style.overflow = "hidden";

      shufflePuzzle();
      renderPuzzle();
    })();
  </script>

</body>
