      <div class="puzzle-message" id="puzzleMessage">

      </div>

      <button class="puzzle-enter" id="puzzleEnter" type="button">

  <script>
    (() => {
      const gate = document.getElementById("puzzleGate");
      const board = document.getElementById("puzzleBoard");
      const message = document.getElementById("puzzleMessage");
      const enterButton = document.getElementById("puzzleEnter");

      let pieces = [0,1,2,3,4,5,6,7,8];
      let selected = null;
      let completed = false;

      function shufflePuzzle() {
        pieces = [0,1,2,3,4,5,6,7,8];

        let previousMove = -1;

        for (let i = 0; i < 100; i++) {
          const first = Math.floor(Math.random() * 9);
          let second;

          do {
            second = Math.floor(Math.random() * 9);
          } while (
            second === first ||
            second === previousMove
          );

          [pieces[first], pieces[second]] =
            [pieces[second], pieces[first]];

          previousMove = first;
        }

        if (pieces.every((piece, index) => piece === index)) {
          [pieces[0], pieces[1]] = [pieces[1], pieces[0]];
        }
      }

      function renderPuzzle() {
        board.innerHTML = "";

        pieces.forEach((piece, position) => {
          const tile = document.createElement("button");
          tile.type = "button";
          tile.className = "puzzle-piece";

          const row = Math.floor(piece / 3);
          const col = piece % 3;

          tile.style.backgroundPosition =
            `${col * 50}% ${row * 50}%`;

          tile.setAttribute(
            "aria-label",
            "Potongan puzzle " + (position + 1)
          );

          if (selected === position) {
            tile.classList.add("selected");
          }

          tile.addEventListener("click", () => {
            selectPiece(position);
          });

          board.appendChild(tile);
        });
      }

      function selectPiece(position) {
        if (completed) return;

        if (selected === null) {
          selected = position;
          renderPuzzle();
          message.textContent =
            "Sekarang pilih potongan kedua ♡";
          return;
        }

        if (selected === position) {
          selected = null;
          renderPuzzle();
          message.textContent =
            "Pilih dua potongan untuk ditukar.";
          return;
        }

        [pieces[selected], pieces[position]] =
          [pieces[position], pieces[selected]];

        selected = null;
        renderPuzzle();
        checkPuzzle();
      }

      function checkPuzzle() {
        const solved = pieces.every(
          (piece, index) => piece === index
        );

        if (solved) {
          completed = true;
          message.textContent =
            "You found every piece! ♡";

          enterButton.classList.add("show");
        } else {
          message.textContent =
            "Almost there. Keep going! ♡";
        }
      }

      enterButton.addEventListener("click", () => {
        gate.classList.add("unlocked");
        document.body.style.overflow = "";
      });

      document.body.style.overflow = "hidden";

      shufflePuzzle();
      renderPuzzle();
    })();

      .record { width: 110px; }
    }
    @media (max-width: 560px) {
      .topbar { width: calc(100% - 28px); padding: 16px 0; }
      .brand { font-size: 1.15rem; }
      .top-link { font-size: .78rem; }
      .hero { width: calc(100% - 30px); min-height: auto; padding: 40px 0 45px; }
      .hero h1 { font-size: clamp(3rem, 15vw, 4.3rem); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;

  <script>
    const loveLetter = `Hi, Lanny

Kita adalah dua orang  
yang dipertemukan dengan banyak alasan.

Awalnya hanya saling sapa,  
bertukar cerita,  
menertawakan hal-hal sederhana,  
lalu perlahan terbiasa  
dengan hadirnya satu sama lain.

Kita menyebutnya teman.  
Dan untuk saat ini,  
barangkali memang itu nama yang paling tepat.

Aku tidak ingin terburu-buru  
memberi nama pada sesuatu  
yang bahkan belum tahu  
akan tumbuh ke arah mana.

Sebab, bukankah ada hal-hal  
yang justru menjadi indah  
karena dibiarkan berjalan sebagaimana mestinya?

Seperti dua orang  
yang awalnya hanya ingin saling mengenal,  
lalu tanpa sadar mulai mengingat  
hal-hal kecil yang sering terlupakan orang lain.

Tapi sudahlah,  
aku tidak ingin menebak-nebak masa depan.

Hari ini, kita masih dua teman  
yang bisa tertawa tanpa perlu alasan,  
bercerita tanpa takut kehabisan topik,  
dan saling hadir tanpa harus menjanjikan apa-apa.

Kalau nanti ternyata  
jalan kita tetap sebagai teman,  
aku harap kita tidak kehilangan  
hal-hal baik yang sudah kita punya.

Namun, kalau suatu hari nanti  
waktu membawa kita pada perasaan yang berbeda,  
kalau percakapan sederhana  
mulai terasa lebih istimewa,  
dan kalau diam-diam kita mulai berharap  
untuk menjadi sedikit lebih dekat—

barangkali,  
kita akan mengerti  
mengapa semuanya harus dimulai  
dengan menjadi teman lebih dahulu.

Untuk sekarang,  
biarlah kita berjalan pelan-pelan.

Tidak perlu memaksa bunga untuk mekar,  
Tidak perlu meminta pagi datang lebih cepat.

Sebab kalau memang ada sesuatu  
yang ditakdirkan tumbuh di antara kita,  
semoga ia tumbuh bukan karena terburu-buru,  
melainkan karena kita sama-sama  
merasa nyaman untuk tinggal.

Dan kalau memang belum waktunya,  
Gapapa.

Kita masih punya hari ini  
untuk saling mengenal lebih jauh.

Barangkali, kita memang hanya teman.  
Untuk saat ini.

Dan untuk segala kemungkinan setelahnya,  
biarlah waktu yang bercerita. 

thank you udah baca. ♡`;

    const reasons = [
      "Sifat.",
      "Semangat,",
      "Mandiri,",
      "Percaya Diri",
      "Pelayanan Gereja",
      "Rambut",
      "Senyuman",
      "Ketawa",
      "Bersin (jujur unik)",
      "Dari semuanya, gua lebih suka lu diem sih"
    ];

    const reasonIcons = ["☼", "✿", "❧", "♡", "☾", "✧", "❀", "☘", "☆", "♧"];

    // Membuat dekorasi daun yang bergerak lambat.
    const gardenBg = document.getElementById("gardenBg");
    const leafSymbols = ["✦", "❧", "✿", "·"];
    for (let i = 0; i < 12; i++) {
      const leaf = document.createElement("span");
      leaf.className = "floating-leaf";
      leaf.textContent = leafSymbols[i % leafSymbols.length];
      leaf.style.left = (Math.random() * 100) + "%";
      leaf.style.animationDuration = (18 + Math.random() * 10) + "s";
      leaf.style.animationDelay = (-Math.random() * 24) + "s";
      leaf.style.fontSize = (12 + Math.random() * 13) + "px";
      gardenBg.appendChild(leaf);
    }

    // Menampilkan kartu alasan.
    const reasonsGrid = document.getElementById("reasonsGrid");
    reasons.forEach((reason, index) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "reason-card";
      card.setAttribute("aria-label", "Buka alasan nomor " + (index + 1));
      card.innerHTML = `
        <div class="reason-inner">
          <div class="reason-front">
            <span class="reason-number">${String(index + 1).padStart(2, "0")}</span>
            <span>${reasonIcons[index]} Tap to reveal</span>
          </div>
          <div class="reason-back">
            <span class="reason-icon">${reasonIcons[index]}</span>
            <p></p>
          </div>
        </div>`;
      card.querySelector(".reason-back p").textContent = reason;
      card.addEventListener("click", () => card.classList.toggle("flipped"));
      reasonsGrid.appendChild(card);
    });

    // Surat cinta: buka dan tutup.
    const letterModal = document.getElementById("letterModal");
    document.getElementById("letterBody").textContent = loveLetter;

    function openLetter() {
      letterModal.classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeLetter() {
      letterModal.classList.remove("open");
      document.body.style.overflow = "";
    }
    document.getElementById("openLetter").addEventListener("click", openLetter);
    document.getElementById("openLetterHero").addEventListener("click", openLetter);
    document.getElementById("closeLetter").addEventListener("click", closeLetter);
    letterModal.addEventListener("click", (event) => {
      if (event.target === letterModal) closeLetter();
    });

    // Galeri: klik foto untuk memperbesar.
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    document.querySelectorAll(".memory-card").forEach((card) => {
      const showImage = () => {
        const img = card.querySelector("img");
        lightboxImage.src = img.src;
        lightboxImage.alt = img.alt;
        lightbox.classList.add("open");
      };
      card.addEventListener("click", showImage);
      card.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          showImage();
        }
      });
    });
    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImage.src = "";
    }
    document.getElementById("closeLightbox").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeLetter();
        closeLightbox();
      }
    });

    // Dua pemutar musik. Saat satu lagu dimainkan, lagu lainnya otomatis berhenti.
    const musicPlayers = [
      {
        audio: document.getElementById("musicOne"),
        record: document.getElementById("recordOne"),
        button: document.getElementById("toggleOne"),
        status: document.getElementById("statusOne")
      },
      {
        audio: document.getElementById("musicTwo"),
        record: document.getElementById("recordTwo"),
        button: document.getElementById("toggleTwo"),
        status: document.getElementById("statusTwo")
      }
    ];

    function updatePlayer(player, isPlaying) {
      player.record.classList.toggle("playing", isPlaying);
      player.button.textContent = isPlaying ? "Ⅱ Pause music" : "▶ Play music";
      player.status.textContent = isPlaying ? "Playing for you ♡" : "Paused ♡";
    }

    musicPlayers.forEach((player, index) => {
      player.button.addEventListener("click", async () => {
        if (player.audio.paused) {
          // Hentikan lagu lain terlebih dahulu.
          musicPlayers.forEach((otherPlayer, otherIndex) => {
            if (otherIndex !== index) {
              otherPlayer.audio.pause();
              otherPlayer.audio.currentTime = 0;
              updatePlayer(otherPlayer, false);
            }
          });

          try {
            await player.audio.play();
            updatePlayer(player, true);
          } catch (error) {
            player.status.textContent = "Pastikan file MP3 ada di folder website ♡";
          }
        } else {
          player.audio.pause();
          updatePlayer(player, false);
        }
      });

      player.audio.addEventListener("ended", () => updatePlayer(player, false));
      player.audio.addEventListener("pause", () => {
        if (player.audio.currentTime === 0 || player.audio.ended) {
          updatePlayer(player, false);
        }
      });
    });

  </script>

  </script>
